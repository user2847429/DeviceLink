name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runner already includes the Android SDK.
      # Avoid the retired "tools" SDK package requested by older setup actions.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        shell: bash
        run: |
          # Retry transient repository/CDN failures (for example HTTP 504).
          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"
            if gradle --no-daemon :app:assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying in 20 seconds..."
              sleep 20
            fi
          done
          exit 1

      # Explicitly expose KVM to the runner before launching the x86_64 emulator.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests (API 35 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest
            test_status=$?
            echo "===== ANDROID TEST XML RESULTS ====="
            find android/app/build/outputs/androidTest-results android/app/build/reports/androidTests -type f \\( -name '*.xml' -o -name '*.txt' \\) -print -exec cat {} \\; 2>/dev/null || true
            echo "===== RECENT DEVICE LOGS ====="
            adb logcat -d -t 1500 2>/dev/null | grep -E -i 'AndroidJUnitRunner|Instrumentation|FATAL EXCEPTION|SSL|KeyStore|DeviceIdentity|AndroidTls' | tail -n 250 || true
            exit "$test_status"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: devicelink-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
